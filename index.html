<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>かんたん家計簿</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>かんたん家計簿</h1>
        <p>収入・支出・積立資産をまとめて管理できます。</p>
      </header>

      <section class="card accent-card">
        <h2>プロフィール・積立設定</h2>
        <form id="profile-form" class="grid">
          <label>
            生年月日
            <input type="date" id="birth-date" required />
          </label>
          <div class="full split-title">
            <h3>積立・保有資産（NISA / iDeCo / 貯蓄性保険 / 貯金）</h3>
            <button id="add-plan-btn" type="button">＋追加</button>
          </div>
          <div id="plan-list" class="full plan-list"></div>
          <button type="submit" class="full">設定を保存</button>
        </form>
      </section>

      <section class="card">
        <h2>取引を追加</h2>
        <form id="transaction-form" class="grid">
          <label>
            日付
            <input type="date" id="date" required />
          </label>
          <label>
            種類
            <select id="type" required>
              <option value="expense">支出</option>
              <option value="income">収入</option>
            </select>
          </label>
          <label>
            カテゴリ
            <select id="category" required></select>
          </label>
          <label>
            金額 (円)
            <input id="amount" type="number" min="1" step="1" required />
          </label>
          <label class="full">
            メモ
            <input id="memo" type="text" placeholder="任意" maxlength="50" />
          </label>
          <button type="submit">追加する</button>
        </form>
      </section>

      <section class="card">
        <h2>今月のサマリー</h2>
        <div class="summary">
          <div>
            <span>前月末残高</span>
            <strong id="carryover-total">¥0</strong>
          </div>
          <div>
            <span>当月収入</span>
            <strong id="income-total">¥0</strong>
          </div>
          <div>
            <span>当月支出（自動反映込）</span>
            <strong id="expense-total">¥0</strong>
          </div>
          <div>
            <span>当月末残高</span>
            <strong id="balance-total">¥0</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>想定資産額（積立別）</h2>
        <div id="asset-forecast" class="asset-forecast"></div>
      </section>

      <section class="card">
        <h2>支出グラフ（カテゴリ別）</h2>
        <div id="expense-chart" class="chart"></div>
        <div id="auto-breakdown" class="auto-breakdown"></div>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>取引一覧</h2>
          <div class="filters">
            <input id="month-filter" type="month" />
            <button id="clear-btn" type="button">全削除</button>
          </div>
        </div>
        <ul id="transaction-list" class="list"></ul>
      </section>
    </main>

    <template id="transaction-item-template">
      <li class="item">
        <div>
          <p class="meta"></p>
          <p class="memo"></p>
        </div>
        <div class="amount-wrap">
          <p class="amount"></p>
          <button class="delete" type="button">削除</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
