<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>かんたん家計簿</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header card">
        <div class="hero-topline">
          <p class="eyebrow">FP家計診断ツール</p>
        </div>
        <div class="hero-copy">
          <h1>かんたん家計簿</h1>
          <p class="hero-subtitle">収入・支出・積立資産を、ひとつの画面で迷わず管理。</p>
        </div>
      </header>

      <section
        id="section-home"
        class="card dashboard-section section-tone-home accordion-section"
        data-nav-section="home"
        data-accordion-section
        data-accordion-initial-expanded="true"
      >
        <button type="button" class="accordion-trigger dashboard-header" aria-expanded="true" aria-controls="panel-home" id="trigger-home">
          <div class="section-heading">
            <h2>家計診断ダッシュボード</h2>
            <p class="section-description">毎月の収支と資産形成の進捗を一目で確認できます。</p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-home" role="region" aria-labelledby="trigger-home">
          <div class="accordion-panel-inner dashboard-panel-inner">
            <div class="dashboard-grid">
              <article class="dashboard-card dashboard-card-balance is-primary">
                <span>当月末残高</span>
                <strong id="dashboard-balance-total">¥0</strong>
              </article>
              <article class="dashboard-card dashboard-card-future is-primary">
                <span>60歳時点の想定総資産額</span>
                <strong id="dashboard-age60-total">¥0</strong>
              </article>
              <article class="dashboard-card dashboard-card-expense is-secondary">
                <span>当月支出</span>
                <strong id="dashboard-expense-total">¥0</strong>
              </article>
              <article class="dashboard-card dashboard-card-saving is-secondary">
                <span>毎月の積立額</span>
                <strong id="dashboard-monthly-saving-total">¥0</strong>
              </article>
              <article class="dashboard-card dashboard-card-carryover is-supporting">
                <span>前月末残高</span>
                <strong id="dashboard-carryover-total">¥0</strong>
              </article>
              <article class="dashboard-card dashboard-card-income is-supporting">
                <span>当月収入</span>
                <strong id="dashboard-income-total">¥0</strong>
              </article>
            </div>
            <article class="diagnosis-card" aria-live="polite">
              <p class="diagnosis-label">FPコメント</p>
              <p id="dashboard-diagnosis-comment" class="diagnosis-text">
                取引データを入力すると、今月の家計診断コメントが表示されます。
              </p>
            </article>
          </div>
        </div>
      </section>

      <section class="card section-tone-profile accordion-section" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-profile" id="trigger-profile">
          <div class="section-heading">
            <h2>基本情報・資産形成設定</h2>
            <p class="section-description">
              記入開始月や生年月日、積立・保有資産の設定を行います。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-profile" role="region" aria-labelledby="trigger-profile">
          <div class="accordion-panel-inner">
            <form id="profile-form" class="grid">
              <label>
                記入開始月
                <input type="month" id="entry-start-month" required />
              </label>
              <label>
                生年月日
                <input type="date" id="birth-date" required />
              </label>
              <div class="full child-accordion" data-child-accordion>
                <button
                  type="button"
                  class="child-accordion-trigger"
                  aria-expanded="false"
                  aria-controls="panel-profile-plan-assets"
                  id="trigger-profile-plan-assets"
                >
                  <h3>積立・保有資産（NISA / iDeCo / 貯蓄性保険 / 貯金）</h3>
                  <span class="child-accordion-toggle" aria-hidden="true">+</span>
                </button>
                <div
                  class="child-accordion-panel"
                  id="panel-profile-plan-assets"
                  role="region"
                  aria-labelledby="trigger-profile-plan-assets"
                  aria-hidden="true"
                >
                  <div class="child-accordion-panel-inner">
                    <div id="plan-list" class="full plan-list"></div>
                  </div>
                </div>
              </div>
              <button type="button" id="add-plan-button" class="full profile-add-plan-button">
                <span aria-hidden="true" class="profile-add-plan-button-icon">＋</span>
                <span>資産形成を登録</span>
              </button>
              <button type="submit" class="full profile-save-settings-button">設定を保存</button>
            </form>
          </div>
        </div>
      </section>


      <section class="card section-tone-recurring accordion-section" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-recurring" id="trigger-recurring">
          <div class="section-heading">
            <h2>定期支出</h2>
            <p class="section-description">
              毎月の固定支出を登録すると、該当月の取引履歴へ自動反映します。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-recurring" role="region" aria-labelledby="trigger-recurring">
          <div class="accordion-panel-inner">
            <div class="recurring-child-accordions">
              <section class="child-accordion" data-child-accordion>
                <button
                  type="button"
                  class="child-accordion-trigger"
                  aria-expanded="false"
                  aria-controls="panel-recurring-form"
                  id="trigger-recurring-form"
                >
                  <h3>定期支出を登録</h3>
                  <span class="child-accordion-toggle" aria-hidden="true">＋</span>
                </button>
                <div
                  class="child-accordion-panel"
                  id="panel-recurring-form"
                  role="region"
                  aria-labelledby="trigger-recurring-form"
                  aria-hidden="true"
                >
                  <div class="child-accordion-panel-inner">
                    <form id="recurring-form" class="grid recurring-form" autocomplete="off">
                      <p id="recurring-edit-status" class="recurring-edit-status" aria-live="polite" hidden>
                        定期支出を編集中
                      </p>
                      <label>
                        支出項目名
                        <select id="recurring-category" required></select>
                      </label>
                      <label>
                        金額 (円)
                        <input id="recurring-amount" type="text" inputmode="numeric" placeholder="例: 68,000" required />
                      </label>
                      <label>
                        引落日
                        <select id="recurring-day" required></select>
                      </label>
                      <label>
                        開始月
                        <input id="recurring-start-month" type="month" required />
                      </label>
                      <label>
                        終了月（任意）
                        <input id="recurring-end-month" type="month" />
                      </label>
                      <label class="full">
                        メモ（任意）
                        <input id="recurring-memo" type="text" maxlength="60" placeholder="任意" />
                      </label>
                      <div class="full recurring-form-actions">
                        <button type="submit" id="recurring-submit-button">追加</button>
                        <button type="button" id="recurring-cancel-button" class="ghost" hidden>キャンセル</button>
                      </div>
                    </form>
                  </div>
                </div>
              </section>

              <section class="child-accordion" data-child-accordion>
                <button
                  type="button"
                  class="child-accordion-trigger"
                  aria-expanded="false"
                  aria-controls="panel-recurring-list"
                  id="trigger-recurring-list"
                >
                  <h3>登録済みの定期支出</h3>
                  <span class="child-accordion-toggle" aria-hidden="true">＋</span>
                </button>
                <div
                  class="child-accordion-panel"
                  id="panel-recurring-list"
                  role="region"
                  aria-labelledby="trigger-recurring-list"
                  aria-hidden="true"
                >
                  <div class="child-accordion-panel-inner">
                    <div id="recurring-list" class="recurring-list"></div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </section>

      <section id="section-input" class="card section-tone-input accordion-section" data-nav-section="input" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-input" id="trigger-input">
          <div class="section-heading">
            <h2>収支を入力</h2>
            <p class="section-description">
              日々の収入・支出を追加して、今月の家計を記録します。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-input" role="region" aria-labelledby="trigger-input">
          <div class="accordion-panel-inner">
            <form id="transaction-form" class="grid">
              <label>
                日付
                <input type="date" id="date" required />
              </label>
              <label>
                種類
                <select id="type" required>
                  <option value="expense">支出</option>
                  <option value="income">収入</option>
                </select>
              </label>
              <label>
                カテゴリ
                <select id="category" required></select>
              </label>
              <label>
                金額 (円)
                <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 50,000" required />
              </label>
              <label class="full">
                メモ
                <input id="memo" type="text" placeholder="任意" maxlength="50" />
              </label>
              <button type="submit">追加する</button>
            </form>
          </div>
        </div>
      </section>

      <section id="section-assets" class="card section-tone-assets accordion-section" data-nav-section="assets" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-assets" id="trigger-assets">
          <div class="section-heading">
            <h2>将来資産シミュレーション</h2>
            <p class="section-description">
              現時点の総資産額の構成比と、60歳時点の想定総資産額を確認できます。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-assets" role="region" aria-labelledby="trigger-assets">
          <div class="accordion-panel-inner">
            <div id="asset-forecast" class="asset-forecast"></div>
          </div>
        </div>
      </section>

      <section class="card section-tone-chart accordion-section" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-chart" id="trigger-chart">
          <div class="section-heading">
            <h2>支出バランス分析</h2>
            <p class="section-description">
              どの項目に支出が偏っているかを視覚的に確認できます。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-chart" role="region" aria-labelledby="trigger-chart">
          <div class="accordion-panel-inner">
            <div id="expense-chart" class="chart"></div>
          </div>
        </div>
      </section>

      <section id="section-history" class="card section-tone-history accordion-section" data-nav-section="history" data-accordion-section>
        <button type="button" class="accordion-trigger" aria-expanded="false" aria-controls="panel-history" id="trigger-history">
          <div class="section-heading">
            <h2>取引履歴</h2>
            <p class="section-description">
              入力済みの取引内容を時系列で確認・削除できます。
            </p>
          </div>
          <span class="accordion-toggle-icon" aria-hidden="true">＋</span>
        </button>
        <div class="accordion-panel" id="panel-history" role="region" aria-labelledby="trigger-history">
          <div class="accordion-panel-inner">
            <div class="filters history-filters">
              <input id="month-filter" type="month" />
            </div>
            <ul id="transaction-list" class="list transaction-list"></ul>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="下部ナビゲーション">
      <button type="button" class="bottom-nav-btn is-active" data-nav-target="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span class="nav-label">ホーム</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-nav-target="input">
        <span class="nav-icon" aria-hidden="true">✎</span>
        <span class="nav-label">入力</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-nav-target="assets">
        <span class="nav-icon" aria-hidden="true">◔</span>
        <span class="nav-label">資産</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-nav-target="schedule">
        <span class="nav-icon" aria-hidden="true">☰</span>
        <span class="nav-label">予定</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-nav-target="history">
        <span class="nav-icon" aria-hidden="true">⎘</span>
        <span class="nav-label">履歴</span>
      </button>
    </nav>

    <p id="nav-toast" class="nav-toast" role="status" aria-live="polite"></p>

    <template id="transaction-item-template">
      <li class="item">
        <div>
          <p class="meta"></p>
          <p class="memo"></p>
        </div>
        <div class="amount-wrap">
          <p class="amount"></p>
          <button class="delete" type="button">削除</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
